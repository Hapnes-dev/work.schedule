<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Schedule to ICS Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 1.1em;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1em;
            transition: border-color 0.3s ease;
        }

        .form-group input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            font-family: 'Courier New', monospace;
            resize: vertical;
            min-height: 300px;
            transition: border-color 0.3s ease;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .example {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid #667eea;
        }

        .example h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .example pre {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.9em;
            border: 1px solid #e0e0e0;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #c33;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #3c3;
        }

        .preview {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .preview h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .preview p {
            color: #666;
            margin-bottom: 15px;
        }

        .preview table {
            width: 100%;
            border-collapse: collapse;
        }

        .preview th,
        .preview td {
            text-align: left;
            padding: 6px 8px;
            border-bottom: 1px solid #e0e0e0;
        }

        .preview td:first-child {
            white-space: nowrap;
        }

        .preview small {
            display: block;
            color: #666;
        }

        .preview select {
            width: 100%;
            max-width: 16em;
            font-size: 1em;
            padding: 4px;
        }

        .preview tr.needs-choice {
            background: #fff3cd;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .preview {
                padding: 12px;
            }

            .preview th,
            .preview td {
                padding: 6px 4px;
            }

            .preview .year {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 Work Schedule to ICS</h1>
            <p>Convert your work schedule to a calendar file</p>
        </div>

        <form id="scheduleForm">
            <div class="form-group">
                <label for="personName">Person Name (Vaktansvarlig):</label>
                <input type="text" id="personName" name="personName" placeholder="e.g., Stine" required>
            </div>

            <div class="form-group">
                <label for="scheduleData">Paste your duty list here:</label>
                <textarea id="scheduleData" name="scheduleData" placeholder="Paste your schedule data here..." required></textarea>
            </div>

            <div id="preview" class="preview" hidden>
                <h3>🕒 Check the times</h3>
                <p id="previewNote"></p>
                <table>
                    <thead>
                        <tr><th>Date</th><th>Shift</th></tr>
                    </thead>
                    <tbody id="previewRows"></tbody>
                </table>
            </div>

            <button type="submit" class="btn">Generate ICS Calendar File</button>
        </form>

        <div class="example">
            <h3>📋 Example Format:</h3>
            <pre>Vakter for Håpnes, Stine

Dato	Arbeidstid	Sted
01.06.2026	09:00_05:00	0092 Extra Grilstad
02.06.2026	08:00_04:00	0092 Extra Grilstad
03.06.2026	03:00_11:15	0092 Extra Grilstad</pre>
        </div>

        <div id="message"></div>
    </div>

    <script>
        document.getElementById('scheduleData').addEventListener('input', function() {
            const data = this.value.trim();
            const nameInput = document.getElementById('personName');
            const match = data.match(/Vakter for\s+(.+)/i);
            if (match && !nameInput.value.trim()) {
                const nameParts = match[1].trim().replace(/,\s*/, ', ').split(',').map(s => s.trim());
                nameInput.value = nameParts.length === 2 ? `${nameParts[1]} ${nameParts[0]}` : nameParts[0];
            }
        });

        document.getElementById('scheduleData').addEventListener('input', renderPreview);
        // A reload or the back button brings the pasted text back without an input event.
        window.addEventListener('pageshow', renderPreview);

        document.getElementById('scheduleForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const personName = document.getElementById('personName').value.trim();
            const scheduleData = document.getElementById('scheduleData').value.trim();
            const messageDiv = document.getElementById('message');

            if (!personName || !scheduleData) {
                showMessage('Please fill in both fields.', 'error');
                return;
            }

            try {
                renderPreview();
                const shifts = resolveSchedule(scheduleData);
                if (shifts.some(shift => !shift.reading)) {
                    throw new Error('Choose the time for the yellow rows in the list above.');
                }
                const icsContent = generateICS(personName, shifts);
                downloadICS(icsContent, `${personName}_work_schedule.ics`);
                showMessage('✅ ICS file generated successfully!', 'success');
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, 'error');
            }
        });

        // The staff app exports its times on a 12-hour clock without AM/PM, so
        // "03:00_11:15" can mean 03:00-11:15 or 15:00-23:15. A row is preset
        // only when exactly one reading lies inside these working hours; any
        // other row has to be chosen in the list under the text box.
        const EARLIEST_START = 5 * 60;
        const LATEST_END = 24 * 60;
        const LONGEST_SHIFT = 13 * 60;
        const DAY = 24 * 60;

        // A date, then the two times. The cells arrive tab-separated or on a
        // line each, depending on where the list was copied from.
        const ROW_PATTERN = /\b(\d{1,2})\.(\d{1,2})\.(\d{4})\b\s+((\d{1,2})[:.](\d{2})\s*[-_\u2013\u2014]\s*(\d{1,2})[:.](\d{2}))(?!\d)/g;
        // Lines that are never a workplace: a row number, a header, the footer.
        const NOT_A_LOCATION = /^(\d+$|No\b|Dato\b|Vakter\b|This is\b)/i;

        const choices = new Map();  // the reading picked by hand, per row

        function parseSchedule(text) {
            const matches = [...text.matchAll(ROW_PATTERN)];
            const rows = [];
            const seen = new Set();

            matches.forEach((match, index) => {
                const [day, month, year, startHour, startMin, endHour, endMin] =
                    [1, 2, 3, 5, 6, 7, 8].map(group => parseInt(match[group]));

                const date = new Date(Date.UTC(year, month - 1, day));
                if (date.getUTCMonth() !== month - 1 || date.getUTCDate() !== day) return;
                if (startHour > 23 || endHour > 23 || startMin > 59 || endMin > 59) return;

                // The workplace is the next cell: the rest of the line, or the
                // next line when every cell was pasted on a line of its own.
                const next = index + 1 < matches.length ? matches[index + 1].index : text.length;
                const tail = text.slice(match.index + match[0].length, next).split(/\r?\n/);
                const sameLine = tail[0].split('\t').map(cell => cell.trim()).find(cell => cell);
                const location = sameLine
                    || tail.slice(1).map(line => line.trim()).find(line => line && !NOT_A_LOCATION.test(line))
                    || '';

                const key = `${day}.${month}.${year} ${match[4]} ${location}`;
                if (seen.has(key)) return;  // the same list pasted twice
                seen.add(key);

                rows.push({
                    year, month, day,
                    raw: match[4],
                    start: [startHour, startMin],
                    end: [endHour, endMin],
                    location
                });
            });

            return rows;
        }

        // A list with any time after 12:59, or one at 00:xx, is on the 24-hour
        // clock and is used as written. Without one, AM/PM is what is missing.
        function usesTwelveHourClock(rows) {
            return rows.every(row => [row.start[0], row.end[0]].every(hour => hour >= 1 && hour <= 12));
        }

        // The shifts a row can stand for, in minutes after 00:00 on its date.
        function shiftReadings(row, twelveHour) {
            const hours = hour => !twelveHour ? [hour] : hour === 12 ? [0, 12] : [hour, hour + 12];
            const readings = [];

            for (const startHour of hours(row.start[0])) {
                for (const endHour of hours(row.end[0])) {
                    const start = startHour * 60 + row.start[1];
                    let end = endHour * 60 + row.end[1];
                    if (end <= start) end += DAY;  // the shift ends after midnight
                    if (!twelveHour || end - start <= LONGEST_SHIFT) readings.push({ start, end });
                }
            }

            return readings.sort((a, b) => a.start - b.start || a.end - b.end);
        }

        function presetReading(readings) {
            if (readings.length === 1) return readings[0];
            const inside = readings.filter(r => r.start >= EARLIEST_START && r.end <= LATEST_END);
            return inside.length === 1 ? inside[0] : null;
        }

        function clock(minutes) {
            const pad = n => String(n).padStart(2, '0');
            return `${pad(Math.floor(minutes / 60) % 24)}:${pad(minutes % 60)}`;
        }

        function span(reading) {
            return `${clock(reading.start)}-${clock(reading.end)}`;
        }

        function rowKey(row) {
            return `${row.day}.${row.month}.${row.year} ${row.raw}`;
        }

        // Every row with the reading that will be written: the one picked by
        // hand, else the preset one, else none yet.
        function resolveSchedule(text) {
            const rows = parseSchedule(text);
            const twelveHour = usesTwelveHourClock(rows);

            return rows.map(row => {
                const readings = shiftReadings(row, twelveHour);
                const picked = choices.get(rowKey(row));
                const reading = readings.find(r => span(r) === picked) || presetReading(readings);
                return { row, readings, reading, twelveHour };
            });
        }

        function renderPreview() {
            const shifts = resolveSchedule(document.getElementById('scheduleData').value);
            const pad = n => String(n).padStart(2, '0');

            document.getElementById('preview').hidden = shifts.length === 0;
            document.getElementById('previewNote').textContent = shifts.length && shifts[0].twelveHour
                ? 'The times in this list have no AM/PM, so 03:00 can mean 03:00 or 15:00. Each row is set to the shift that fits working hours 05:00-24:00. Change a row that is wrong; a yellow row needs your choice.'
                : 'This list is on the 24-hour clock, so the times are used as written.';

            document.getElementById('previewRows').replaceChildren(...shifts.map(({ row, readings, reading }) => {
                const tr = document.createElement('tr');
                const weekday = new Date(Date.UTC(row.year, row.month - 1, row.day))
                    .toLocaleDateString(undefined, { weekday: 'short', timeZone: 'UTC' });

                // The date, with the times as the list has them underneath.
                const listed = tr.insertCell();
                listed.textContent = `${weekday} ${pad(row.day)}.${pad(row.month)}`;
                const year = listed.appendChild(document.createElement('span'));
                year.className = 'year';  // left out on a phone, where the row is narrow
                year.textContent = `.${row.year}`;
                listed.appendChild(document.createElement('small')).textContent = row.raw;

                const cell = tr.insertCell();
                if (readings.length === 1) {
                    cell.textContent = span(reading);
                    return tr;
                }

                const select = document.createElement('select');
                select.required = true;
                if (!reading) {
                    select.add(new Option('Choose…', ''));
                    tr.className = 'needs-choice';
                }
                readings.forEach(r => {
                    const label = span(r) + (r.end > DAY ? ' (next day)' : '');
                    select.add(new Option(label, span(r), false, r === reading));
                });
                select.addEventListener('change', () => {
                    choices.set(rowKey(row), select.value);
                    tr.className = select.value ? '' : 'needs-choice';
                });
                cell.appendChild(select);
                return tr;
            }));
        }

        function generateICS(personName, shifts) {
            const events = shifts.map(({ row, reading }) => ({
                title: `${personName} vakt ${span(reading)}`,
                location: row.location,
                // Minutes past 24:00 roll over into the next day.
                startDate: new Date(row.year, row.month - 1, row.day, 0, reading.start),
                endDate: new Date(row.year, row.month - 1, row.day, 0, reading.end)
            }));
            
            if (events.length === 0) {
                throw new Error('No valid schedule entries found. Please check your data format.');
            }
            
            // Generate ICS content
            let icsContent = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Work Schedule Converter//EN',
                'CALSCALE:GREGORIAN',
                'METHOD:PUBLISH'
            ].join('\r\n');
            
            events.forEach((event, index) => {
                const uid = `work-${Date.now()}-${index}@workscheduler.local`;
                const dtStamp = formatICSDate(new Date());
                const dtStart = formatICSDate(event.startDate);
                const dtEnd = formatICSDate(event.endDate);
                
                icsContent += '\r\n' + [
                    'BEGIN:VEVENT',
                    `UID:${uid}`,
                    `DTSTAMP:${dtStamp}`,
                    `DTSTART:${dtStart}`,
                    `DTEND:${dtEnd}`,
                    `SUMMARY:${event.title}`,
                    `LOCATION:${event.location}`,
                    'STATUS:CONFIRMED',
                    'TRANSP:OPAQUE',
                    'END:VEVENT'
                ].join('\r\n');
            });
            
            icsContent += '\r\nEND:VCALENDAR';
            
            return icsContent;
        }
        
        function formatICSDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hour = String(date.getHours()).padStart(2, '0');
            const minute = String(date.getMinutes()).padStart(2, '0');
            const second = String(date.getSeconds()).padStart(2, '0');
            
            return `${year}${month}${day}T${hour}${minute}${second}`;
        }
        
        function downloadICS(content, filename) {
            const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = type;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
